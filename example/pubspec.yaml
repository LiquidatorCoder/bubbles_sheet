name: bubbles_sheet_example
description: Demonstrates bubbles_sheet's detents, chrome slots and theming.
publish_to: "none"
version: 1.0.0

# Deliberately NOT a workspace member. This pubspec ships inside the published
# archive, and `resolution: workspace` there means `pub get` fails for anyone who
# downloads the example — there is no workspace root above it on their disk.

environment:
  sdk: ^3.11.1
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  bubbles_sheet:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
